</style></head><body>
<header><div class="brand"><h1>Müller Atelier</h1><p>Simulador de precificação de bordados, kits e presentes</p></div><span id="saveState"></span></header>
<nav aria-label="Seções"><div><button data-tab="kits">Kits e preços</button><button data-tab="products">Produtos</button><button data-tab="platforms">Plataformas</button><button data-tab="team">Ajustes e backup</button></div></nav>
<main id="view"></main><div id="toast" role="status" aria-live="polite"></div>
<script>
// ===== Núcleo de cálculo (puro, testável) =====
function num(v){ if(v===null||v===undefined) return 0; const n=parseFloat(String(v).replace(/\./g,(m,i,s)=>s.includes(',')?'':m).replace(',','.')); return isFinite(n)?n:0; }
function round2(v){ return Math.round((v+Number.EPSILON)*100)/100; }
function ceilCent(v){ return Math.ceil(v*100-1e-7)/100; }

function kitCosts(kit, products, S){
  let qty=0, mat=0, varOther=0, minutes=0; const lines=[];
  for(const it of kit.items){
    const p=products.find(x=>x.id===it.pid); if(!p) continue;
    const q=Math.max(0,num(it.qty)); if(!q) continue;
    qty+=q; mat+=q*num(p.material); varOther+=q*num(p.other);
    minutes+=q*(num(p.bordado)+num(p.costura)+num(p.extraMin));
    lines.push({name:p.name,q});
  }
  minutes+=Math.max(0,num(kit.prep));
  const hours=minutes/60, people=S.people;
  let laborByPerson, labor;
  if(S.laborMode==='B'){
    laborByPerson=people.map(p=>hours*Math.max(0,num(p.timePct))/100*Math.max(0,num(p.rate)));
    labor=laborByPerson.reduce((a,b)=>a+b,0);
  } else {
    labor=hours*Math.max(0,num(S.rate));
    laborByPerson=people.map(()=>people.length?labor/people.length:0);
  }
  const pack=Math.max(0,num(kit.packaging)), orderOther=Math.max(0,num(kit.otherCost));
  const base=mat+pack+varOther+orderOther+labor;
  return {qty,mat,pack,varOther,orderOther,other:varOther+orderOther,minutes,hours,labor,laborByPerson,base,lines,bill:Math.max(1,Math.round(num(kit.billable)||1))};
}

// Faixas de preço: a faixa vale quando o preço de cada item cobrado (P ÷ itens) é >= "min".
function bandsOf(pf){
  const raw=(pf.bands&&pf.bands.length)?pf.bands:[{min:0,pct:0,item:0,ship:0}];
  const b=raw.map(x=>({min:Math.max(0,num(x.min)),pct:num(x.pct),item:num(x.item),ship:num(x.ship)})).sort((x,y)=>x.min-y.min);
  b[0].min=0; return b;
}
function bandIndex(P,B,bill){ const u=P/bill; let k=0; for(let i=0;i<B.length;i++) if(u+1e-9>=B[i].min) k=i; return k; }
// Taxas de uma venda ao preço P. force = {band, cap, pcap} fixa o regime (usado pelo solver).
function fees(P, pf, bill, force){
  const B=bandsOf(pf), k=force?force.band:bandIndex(P,B,bill), band=B[k];
  const pctBase=P+(pf.freightInBase?num(pf.freightBuyer):0);
  let comm=pctBase*band.pct/100; const capT=num(pf.cap)*bill;
  const useCap=force?force.cap:(num(pf.cap)>0&&comm>capT);
  let capped=false; if(num(pf.cap)>0&&useCap){ comm=capT; capped=true; }
  let promo=pctBase*num(pf.pctPromo)/100; const pcapT=num(pf.promoCap)*bill;
  const usePcap=force?force.pcap:(num(pf.promoCap)>0&&promo>pcapT);
  if(num(pf.promoCap)>0&&usePcap) promo=pcapT;
  const service=pctBase*num(pf.pctService)/100;
  const platform=comm+service+promo+band.item*bill+num(pf.perOrder)+num(pf.perItem)*bill+num(pf.logistics);
  const ads=pf.adsMode==='fix'?num(pf.ads):P*num(pf.ads)/100;
  const tax=P*num(pf.taxPct)/100+num(pf.taxFixed);
  const freight=band.ship+num(pf.freightSeller)-num(pf.subsidy);
  const other=num(pf.otherFixed);
  return {comm,platform,ads,tax,freight,other,total:platform+ads+tax+freight+other,capped,band:k,bandMin:band.min};
}

// Menor preço (em centavos) com lucro >= m * P. Avalia cada regime (faixa, teto) e as fronteiras. null = sem solução.
function solvePrice(base, pf, bill, m){
  const g=(P,f)=>P-base-fees(P,pf,bill,f).total-m*P;
  const B=bandsOf(pf), F=pf.freightInBase?num(pf.freightBuyer):0, cands=[];
  B.forEach((band,k)=>{
    if(k>0) cands.push(band.min*bill);
    if(num(pf.cap)>0&&band.pct>0) cands.push(num(pf.cap)*bill/(band.pct/100)-F);
    for(const cap of [false,true]) for(const pcap of [false,true]){
      const f={band:k,cap,pcap}, a=g(0,f), sl=g(1,f)-a;
      if(sl>1e-12) cands.push(-a/sl);
    }
  });
  if(num(pf.promoCap)>0&&num(pf.pctPromo)>0) cands.push(num(pf.promoCap)*bill/(num(pf.pctPromo)/100)-F);
  let best=null;
  for(const c of cands){
    if(!(c>0)||!isFinite(c)) continue;
    let P=ceilCent(c);
    for(let i=0;i<5;i++){ if(g(P)>=-1e-9){ if(best===null||P<best) best=P; break; } P=round2(P+0.01); }
  }
  return best;
}

function evaluate(P, kc, pf, S){
  const f=fees(P,pf,kc.bill);
  const total=kc.base+f.total, profit=P-total, margin=P>0?profit/P:0, target=num(S.margin)/100;
  let status;
  if(Math.abs(profit)<0.005) status='even';
  else if(profit<0) status='loss';
  else if(margin+1e-9<target) status='below';
  else status='ok';
  const reserve=profit>0?profit*Math.max(0,num(S.reserve))/100:0, dist=profit-reserve;
  const n=S.people.length;
  const shares=S.people.map(p=>S.splitMode==='custom'?dist*num(p.share)/100:(n?dist/n:0));
  const persons=S.people.map((p,i)=>({name:p.name,labor:kc.laborByPerson[i]||0,share:shares[i],total:(kc.laborByPerson[i]||0)+shares[i]}));
  return {P,f,total,profit,margin,status,reserve,dist,persons,perUnit:kc.qty?P/kc.qty:0};
}

function priceKit(kit, products, pf, S){
  const kc=kitCosts(kit,products,S);
  const m=num(S.margin)/100;
  const res={kc,minP:null,recP:null,err:null};
  if(!kc.qty){ res.err='Adicione pelo menos um produto com quantidade maior que zero.'; return res; }
  res.minP=solvePrice(kc.base,pf,kc.bill,0);
  if(res.minP===null){ res.err='As taxas percentuais somam 100% ou mais: não existe preço que cubra os custos.'; return res; }
  if(m>=1){ res.err='A margem desejada precisa ser menor que 100%.'; }
  else { res.recP=solvePrice(kc.base,pf,kc.bill,m); if(res.recP===null) res.err='Taxas + margem desejada chegam a 100% ou mais: reduza a margem ou as taxas.'; }
  res.min=evaluate(res.minP,kc,pf,S);
  if(res.recP!==null){
    res.rec=evaluate(res.recP,kc,pf,S);
    const d=Math.min(100,Math.max(0,num(kit.discount)));
    if(d>0){ res.discP=round2(res.recP*(1-d/100)); res.disc=evaluate(res.discP,kc,pf,S); }
  }
  if(num(kit.testPrice)>0) res.test=evaluate(round2(num(kit.testPrice)),kc,pf,S);
  return res;
}
// ===== Interface =====
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const brl=v=>BRL.format(round2(v||0)).replace(/^-?/,m=>m);
const pct=v=>(v*100).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
const hm=min=>{const h=Math.floor(min/60),m=Math.round(min-h*60);return (h?h+' h ':'')+(m||!h?m+' min':'').trim();};

function blankPlatform(name){return {id:uid(),name,bands:[{min:0,pct:0,item:0,ship:0}],pctService:0,pctPromo:0,promoCap:0,cap:0,perOrder:0,perItem:0,logistics:0,freightSeller:0,subsidy:0,freightBuyer:0,freightInBase:false,adsMode:'pct',ads:0,taxPct:0,taxFixed:0,otherFixed:0,note:''};}
// Taxas pesquisadas em outubro de 2026 (fontes públicas; confira sempre na Central do Vendedor)
function researchedPlatforms(){
  const P=(name,o)=>({...blankPlatform(name),...o});
  const shopee=()=>[{min:0,pct:20,item:4,ship:0},{min:80,pct:14,item:16,ship:0},{min:100,pct:14,item:20,ship:0},{min:200,pct:14,item:26,ship:0},{min:500,pct:14,item:28,ship:0}];
  const ml=pct=>[{min:0,pct,item:6.5,ship:0},{min:79,pct,item:0,ship:11.97}];

const OLD_DEFAULT_NAMES=['Shopee','Mercado Livre Clássico','Mercado Livre Premium','TikTok Shop','Instagram / venda direta'];
function migrate(s){
  s.platforms.forEach(p=>{
    if(!Array.isArray(p.bands)){
      const pct=p.mode==='det'?num(p.pctComm):num(p.pctTotal);
      p.bands=[{min:0,pct,item:0,ship:0}];
      if(num(p.thrPrice)>0&&num(p.thrFee)>0) p.bands=[{min:0,pct,item:num(p.thrFee),ship:0},{min:num(p.thrPrice),pct,item:0,ship:0}];
      if(p.mode!=='det'){ p.pctService=0; p.pctPromo=0; }
      p.promoCap=p.promoCap||0; p.note=p.note||'';
    }
  });
  if(!s.v||s.v<2){
    const keep=s.platforms.filter(p=>!OLD_DEFAULT_NAMES.includes(p.name));
    s.platforms=[...researchedPlatforms(),...keep];
    s.v=2;
  }
  const ids=s.platforms.map(p=>p.id);
  if(!ids.includes(s.ui.platformId)) s.ui.platformId=ids[0];
  if(!ids.includes(s.ui.editPlat)) s.ui.editPlat=ids[0];
  return s;
}

// ---- persistência ----
// Tudo é guardado como JSON: estado atual (conta + aparelho), histórico de cópias e backup em arquivo .json
let dbRef=null, bakRef=null, saveT=null, pending=false, backups=[], lastBak=0, downloadsP=Promise.resolve(null);
const LS='muller-atelier-v1';
function setSave(t){const e=document.getElementById('saveState'); if(e) e.textContent=t;}
function persistNow(){
  clearTimeout(saveT); if(!pending) return; pending=false;
  const json=JSON.stringify(state);
  try{localStorage.setItem(LS,json);}catch(e){}
  maybeBackup(json,false);
  if(dbRef){ dbRef.set({state:json,updatedAt:Date.now()}).then(()=>setSave('Salvo na sua conta')).catch(()=>setSave('Salvo neste aparelho')); }
  else setSave('Salvo neste aparelho');
}
function save(){ pending=true; setSave('Salvando…'); clearTimeout(saveT); saveT=setTimeout(persistNow,400); }
function mergeBaks(list){
  const m=new Map(); [...backups,...(list||[])].forEach(b=>{ if(b&&b.at&&typeof b.state==='string') m.set(b.at,b); });
  backups=[...m.values()].sort((a,b)=>b.at-a.at).slice(0,15); lastBak=backups[0]?.at||0;
}
function maybeBackup(json,force){
  const now=Date.now(); if(!force && now-lastBak<10*60*1000) return; lastBak=now;
  backups=[{at:now,state:json},...backups].slice(0,15);
  while(backups.length>1 && JSON.stringify(backups).length>200000) backups.pop();
  try{localStorage.setItem(LS+'-bak',JSON.stringify(backups));}catch(e){}
  if(bakRef) bakRef.set({list:backups}).catch(()=>{});
  const e=document.getElementById('bakList'); if(e) e.innerHTML=bakList();
}
function bakList(){
  if(!backups.length) return '<p class="note">Nenhuma cópia ainda. A primeira é criada na próxima alteração.</p>';
  return '<ul class="baks">'+backups.map(b=>{ let info=''; try{ const s=JSON.parse(b.state); info=`${s.products.length} produtos, ${s.kits.length} kits`; }catch(e){}
    return `<li><span>${new Date(b.at).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}<small>${info}</small></span><button class="link" data-act="restoreBak" data-id="${b.at}">Restaurar</button></li>`; }).join('')+'</ul>';
}
function blobDownload(name,text){
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'application/json'})); a.download=name;
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); return true; }catch(e){ return false; }
}
// kind: 'all' = tudo; 'config' = só plataformas, equipe e margem
async function exportJson(kind){
  const day=new Date().toISOString().slice(0,10), at=new Date().toISOString();
  const payload=kind==='config'
    ? {app:'muller-atelier',type:'config',version:2,exportedAt:at,config:{platforms:state.platforms,settings:state.settings}}
    : {app:'muller-atelier',type:'full',version:2,exportedAt:at,state};
  const json=JSON.stringify(payload,null,2);
  const name=(kind==='config'?'muller-atelier-configuracoes-':'muller-atelier-backup-')+day+'.json';
  let dl=null; try{ dl=await downloadsP; }catch(e){}
  if(dl){ try{ await dl.save({filename:name,data:json}); toast('Arquivo exportado'); return; }catch(e){ if(e&&e.code==='declined') return; } }
  if(!window.claude && blobDownload(name,json)){ toast('Arquivo exportado'); return; }
  const ok=await copyText(json); toast(ok?'JSON copiado: cole num arquivo .json':'Não foi possível exportar');
}
async function importFile(file){
  let obj; try{ obj=JSON.parse(await file.text()); }catch(e){ toast('Arquivo JSON inválido'); return; }
  const c=obj&&obj.config;
  if(c){
    if(!Array.isArray(c.platforms)||!c.platforms.length||!c.settings||!Array.isArray(c.settings.people)||!c.settings.people.length){ toast('Arquivo de configurações incompleto'); return; }
    if(!confirm('Substituir plataformas, equipe e margem pelas do arquivo? Seus produtos e kits continuam como estão.')) return;
    maybeBackup(JSON.stringify(state),true);
    const s=migrate({...JSON.parse(JSON.stringify(state)),platforms:c.platforms,settings:c.settings,v:2});
    state=s; save(); render(); toast('Configurações importadas'); return;
  }
  const s=load(JSON.stringify(obj&&obj.state?obj.state:obj));
  if(!s){ toast('Esse arquivo não é um backup do simulador'); return; }
  if(!confirm('Substituir todos os dados atuais pelo arquivo? Os dados atuais ficam guardados no histórico de cópias.')) return;
  maybeBackup(JSON.stringify(state),true); state=s; save(); render(); toast('Backup importado');
}
function load(json){ try{ const s=JSON.parse(json); if(s&&s.products&&s.kits&&s.platforms&&s.settings){ const d=defaults(); s.ui={...d.ui,...(s.ui||{})}; return migrate(s); } }catch(e){} return null; }
async function initDb(){
  try{
    if(!window.claude||!window.claude.use) return;
    downloadsP=claude.use('downloads').catch(()=>null);
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    dbRef=db.doc('data/users/'+id+'/app');
    bakRef=db.doc('data/users/'+id+'/backup');
    try{ const bs=await bakRef.get(); if(bs.exists) mergeBaks(bs.data().list); }catch(e){}
    const snap=await dbRef.get();
    const s=snap.exists?load(snap.data().state):null;
    if(s){ state=s; render(); setSave('Salvo na sua conta'); } else save();
    if(backups.length) bakRef.set({list:backups}).catch(()=>{});
  }catch(e){ dbRef=null; }
}

  e.persons.forEach(p=>L.push(`${p.name}: trabalho ${brl(p.labor)} + lucro ${brl(p.share)} = ${brl(p.total)}`));
  if(e.reserve>0) L.push(`Reserva do ateliê: ${brl(e.reserve)}`);
  if(r.disc) L.push(``,`Com ${num(k.discount)}% de desconto: ${brl(r.discP)} — lucro ${brl(r.disc.profit)} (${pct(r.disc.margin)}) — ${statusTxt[r.disc.status]}`);
  if(r.test) L.push(``,`Preço testado ${brl(r.test.P)}: lucro ${brl(r.test.profit)} (${pct(r.test.margin)}) — ${statusTxt[r.test.status]}`);
  return L.join('\n');
}

function compareTable(){
  const u=state.ui, p=state.products.find(x=>x.id===u.productId)||state.products[0]; if(!p) return '';

function teamCheck(){
  const st=S(); let h='';
  if(st.splitMode==='custom'){ const t=st.people.reduce((a,p)=>a+num(p.share),0);
    h+=Math.abs(t-100)<0.001?`<p class="alert ok">Parte do lucro soma 100%.</p>`:`<p class="alert loss">A parte do lucro soma ${t.toLocaleString('pt-BR')}%. Ajuste para 100%.</p>`; }
  if(num(st.margin)>=100) h+=`<p class="alert loss">A margem precisa ser menor que 100%.</p>`;
  return h;
}

// ===== eventos =====
function onInput(e){
  const t=e.target; if(!t.dataset||!t.dataset.col) return;
  if(t.type==='radio'||t.type==='checkbox'||t.tagName==='SELECT') return;
  if(t.dataset.col==='bands'){ const p=state.platforms.find(x=>x.id===t.dataset.pid); const b=p&&p.bands[+t.dataset.id]; if(b) b[t.dataset.f]=t.value; save(); renderResults(); return; }
  setVal(t.dataset.col,t.dataset.id,t.dataset.f,t.value); save(); renderResults();
}
function onChange(e){
  const t=e.target;
  if(t.id==='importFile'){ const f=t.files&&t.files[0]; t.value=''; if(f) importFile(f); return; }
  if(!t.dataset||!t.dataset.col) return;
  if(!(t.type==='radio'||t.type==='checkbox'||t.tagName==='SELECT')) return;
  setVal(t.dataset.col,t.dataset.id,t.dataset.f,t.type==='checkbox'?t.checked:t.value); save(); render();
}
async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); return true; }catch(e){
    const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); let ok=false; try{ok=document.execCommand('copy');}catch(_){} ta.remove(); return ok; }
}
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2200); }
function onClick(e){
  const b=e.target.closest('[data-act],[data-tab]'); if(!b) return;
  if(b.dataset.tab){ state.ui.tab=b.dataset.tab; save(); render(); window.scrollTo(0,0); return; }
  const a=b.dataset.act, id=b.dataset.id, k=curKit(), u=state.ui;
  switch(a){
    case 'selKit': u.kitId=id; break;
    case 'addKit': { const nk={id:uid(),name:'Novo kit',items:state.products[0]?[{id:uid(),pid:state.products[0].id,qty:1}]:[],packaging:2,prep:0,otherCost:0,billable:1,discount:0,testPrice:''}; state.kits.push(nk); u.kitId=nk.id; u.tab='kits'; break; }
    case 'dupKit': { const c=JSON.parse(JSON.stringify(k)); c.id=uid(); c.name=k.name+' (cópia)'; c.items.forEach(i=>i.id=uid()); state.kits.push(c); u.kitId=c.id; toast('Kit duplicado'); break; }
    case 'delKit': if(!confirm(`Excluir “${k.name}”?`)) return; state.kits=state.kits.filter(x=>x!==k); u.kitId=state.kits[0]?.id; break;
    case 'addItem': k.items.push({id:uid(),pid:state.products[0].id,qty:1}); break;
    case 'delItem': k.items=k.items.filter(i=>i.id!==id); break;
    case 'selPlatform': u.platformId=id; break;
    case 'addProduct': { const p={id:uid(),name:'Novo produto',material:0,other:0,bordado:0,costura:0,extraMin:0}; state.products.unshift(p); u.productId=p.id; break; }
    case 'delProduct': { const p=state.products.find(x=>x.id===id); const used=state.kits.filter(kk=>kk.items.some(i=>i.pid===id)).length;
      if(!confirm(`Excluir “${p.name}”?${used?` Ele será removido de ${used} kit(s).`:''}`)) return;
      state.products=state.products.filter(x=>x.id!==id); state.kits.forEach(kk=>kk.items=kk.items.filter(i=>i.pid!==id)); break; }
    case 'editPlat': u.editPlat=id; break;
    case 'addPlatform': { const p=blankPlatform('Nova plataforma'); state.platforms.push(p); u.editPlat=p.id; break; }
    case 'addBand': { const p=state.platforms.find(x=>x.id===u.editPlat); const l=p.bands[p.bands.length-1]; p.bands.push({min:round2(num(l.min)+50),pct:l.pct,item:l.item,ship:l.ship}); break; }
    case 'delBand': { const p=state.platforms.find(x=>x.id===u.editPlat); p.bands.splice(+id,1); break; }
    case 'dupPlatform': { const s=state.platforms.find(x=>x.id===u.editPlat); const c={...JSON.parse(JSON.stringify(s)),id:uid(),name:s.name+' (cópia)'}; state.platforms.push(c); u.editPlat=c.id; break; }
    case 'delPlatform': { if(state.platforms.length<2){ toast('Mantenha pelo menos uma plataforma'); return; } const s=state.platforms.find(x=>x.id===u.editPlat); if(!confirm(`Excluir “${s.name}”?`)) return;
      state.platforms=state.platforms.filter(x=>x!==s); u.editPlat=state.platforms[0].id; if(u.platformId===s.id) u.platformId=state.platforms[0].id; break; }
    case 'addPerson': { const n=S().people.length+1; S().people.push({id:uid(),name:'Pessoa '+n,rate:S().rate,timePct:100,share:0}); break; }
    case 'delPerson': S().people=S().people.filter(p=>p.id!==id); break;
    case 'copy': copyText(summaryText()).then(ok=>toast(ok?'Resumo copiado':'Não foi possível copiar')); return;
    case 'print': window.print(); return;
    case 'restore': if(!confirm('Restaurar todos os valores iniciais do Müller Atelier? Os dados atuais ficam guardados no histórico de cópias.')) return; maybeBackup(JSON.stringify(state),true); state=defaults(); toast('Valores iniciais restaurados'); break;
    case 'clear': if(!confirm('Apagar todos os produtos e kits? Uma cópia fica guardada no histórico.')) return; maybeBackup(JSON.stringify(state),true); state.products=[]; state.kits=[]; u.kitId=null; u.tab='products'; break;
    case 'exportJson': exportJson(id); return;
    case 'restoreBak': { const b=backups.find(x=>String(x.at)===id); const s=b&&load(b.state); if(!s){ toast('Cópia inválida'); return; }
      if(!confirm('Voltar para a cópia de '+new Date(b.at).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})+'? Os dados atuais também ficam guardados no histórico.')) return;
      maybeBackup(JSON.stringify(state),true); state=s; state.ui.tab='team'; toast('Cópia restaurada'); break; }
    default: return;
  }
  save(); render();
}
document.addEventListener('DOMContentLoaded',()=>{
  try{ const s=load(localStorage.getItem(LS)); if(s) state=s; }catch(e){}
  try{ mergeBaks(JSON.parse(localStorage.getItem(LS+'-bak')||'[]')); }catch(e){}
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') persistNow(); });
  window.addEventListener('pagehide',persistNow);
  const v=document.getElementById('view');
  v.addEventListener('input',onInput); v.addEventListener('change',onChange);
  document.addEventListener('click',onClick);
  document.addEventListener('keydown',e=>{ if(e.target.id==='importLabel'&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); document.getElementById('importFile').click(); } });
  render(); initDb();
});
