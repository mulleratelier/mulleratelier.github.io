<header><div class="brand"><h1>Müller Atelier</h1><p>Simulador de precificação de bordados, kits e presentes</p></div><span id="saveState"></span></header>
<nav aria-label="Seções"><div><button data-tab="kits">Kits e preços</button><button data-tab="products">Produtos</button><button data-tab="cash">Caixa do mês</button><button data-tab="plan">Planejamento</button><button data-tab="platforms">Plataformas</button><button data-tab="team">Ajustes e backup</button></div></nav>
<main id="view"></main><div id="toast" role="status" aria-live="polite"></div>
<script>
// ===== Núcleo de cálculo (puro, testável) =====
function num(v){ if(v===null||v===undefined) return 0; const n=parseFloat(String(v).replace(/\./g,(m,i,s)=>s.includes(',')?'':m).replace(',','.')); return isFinite(n)?n:0; }
function round2(v){ return Math.round((v+Number.EPSILON)*100)/100; }
function ceilCent(v){ return Math.ceil(v*100-1e-7)/100; }

function kitCosts(kit, products, S){
  let qty=0, mat=0, varOther=0, minutes=0; const lines=[];
  for(const it of kit.items){
    const p=products.find(x=>x.id===it.pid); if(!p) continue;
    const q=Math.max(0,num(it.qty)); if(!q) continue;
    qty+=q; mat+=q*num(p.material); varOther+=q*num(p.other);
    minutes+=q*(num(p.bordado)+num(p.costura)+num(p.extraMin));
    lines.push({name:p.name,q});
  }
  minutes+=Math.max(0,num(kit.prep));
  const hours=minutes/60, people=S.people;
  let laborByPerson, labor;
  if(S.laborMode==='B'){
    laborByPerson=people.map(p=>hours*Math.max(0,num(p.timePct))/100*Math.max(0,num(p.rate)));
    labor=laborByPerson.reduce((a,b)=>a+b,0);
  } else {
    labor=hours*Math.max(0,num(S.rate));
    laborByPerson=people.map(()=>people.length?labor/people.length:0);
  }
  const pack=Math.max(0,num(kit.packaging)), orderOther=Math.max(0,num(kit.otherCost));
  const base=mat+pack+varOther+orderOther+labor;
  return {qty,mat,pack,varOther,orderOther,other:varOther+orderOther,minutes,hours,labor,laborByPerson,base,lines,bill:Math.max(1,Math.round(num(kit.billable)||1))};
}

// Faixas de preço: a faixa vale quando o preço de cada item cobrado (P ÷ itens) é >= "min".
function bandsOf(pf){
  const raw=(pf.bands&&pf.bands.length)?pf.bands:[{min:0,pct:0,item:0,ship:0}];
  const b=raw.map(x=>({min:Math.max(0,num(x.min)),pct:num(x.pct),item:num(x.item),ship:num(x.ship)})).sort((x,y)=>x.min-y.min);
  b[0].min=0; return b;
}
function bandIndex(P,B,bill){ const u=P/bill; let k=0; for(let i=0;i<B.length;i++) if(u+1e-9>=B[i].min) k=i; return k; }
// Taxas de uma venda ao preço P. force = {band, cap, pcap} fixa o regime (usado pelo solver).
function fees(P, pf, bill, force){
  const B=bandsOf(pf), k=force?force.band:bandIndex(P,B,bill), band=B[k];
  const pctBase=P+(pf.freightInBase?num(pf.freightBuyer):0);
  let comm=pctBase*band.pct/100; const capT=num(pf.cap)*bill;
  const useCap=force?force.cap:(num(pf.cap)>0&&comm>capT);
  let capped=false; if(num(pf.cap)>0&&useCap){ comm=capT; capped=true; }
  let promo=pctBase*num(pf.pctPromo)/100; const pcapT=num(pf.promoCap)*bill;
  const usePcap=force?force.pcap:(num(pf.promoCap)>0&&promo>pcapT);
  if(num(pf.promoCap)>0&&usePcap) promo=pcapT;
  const service=pctBase*num(pf.pctService)/100;
  const platform=comm+service+promo+band.item*bill+num(pf.perOrder)+num(pf.perItem)*bill+num(pf.logistics);
  const ads=pf.adsMode==='fix'?num(pf.ads):P*num(pf.ads)/100;
  const tax=P*num(pf.taxPct)/100+num(pf.taxFixed);
  const freight=band.ship+num(pf.freightSeller)-num(pf.subsidy);
  const other=num(pf.otherFixed);
  return {comm,platform,ads,tax,freight,other,total:platform+ads+tax+freight+other,capped,band:k,bandMin:band.min};
}

// Menor preço (em centavos) com lucro >= m * P. Avalia cada regime (faixa, teto) e as fronteiras. null = sem solução.
function solvePrice(base, pf, bill, m){
  const g=(P,f)=>P-base-fees(P,pf,bill,f).total-m*P;
  const B=bandsOf(pf), F=pf.freightInBase?num(pf.freightBuyer):0, cands=[];
  B.forEach((band,k)=>{
    if(k>0) cands.push(band.min*bill);
    if(num(pf.cap)>0&&band.pct>0) cands.push(num(pf.cap)*bill/(band.pct/100)-F);
    for(const cap of [false,true]) for(const pcap of [false,true]){
      const f={band:k,cap,pcap}, a=g(0,f), sl=g(1,f)-a;
      if(sl>1e-12) cands.push(-a/sl);
    }
  });
  if(num(pf.promoCap)>0&&num(pf.pctPromo)>0) cands.push(num(pf.promoCap)*bill/(num(pf.pctPromo)/100)-F);
  let best=null;
  for(const c of cands){
    if(!(c>0)||!isFinite(c)) continue;
    let P=ceilCent(c);
    for(let i=0;i<5;i++){ if(g(P)>=-1e-9){ if(best===null||P<best) best=P; break; } P=round2(P+0.01); }
  }
  return best;
}

function evaluate(P, kc, pf, S){
  const f=fees(P,pf,kc.bill);
  const total=kc.base+f.total, profit=P-total, margin=P>0?profit/P:0, target=num(S.margin)/100;
  let status;
  if(Math.abs(profit)<0.005) status='even';
  else if(profit<0) status='loss';
  else if(margin+1e-9<target) status='below';
  else status='ok';
  const reserve=profit>0?profit*Math.max(0,num(S.reserve))/100:0, dist=profit-reserve;
  const n=S.people.length;
  const shares=S.people.map(p=>S.splitMode==='custom'?dist*num(p.share)/100:(n?dist/n:0));
  const persons=S.people.map((p,i)=>({name:p.name,labor:kc.laborByPerson[i]||0,share:shares[i],total:(kc.laborByPerson[i]||0)+shares[i]}));
  return {P,f,total,profit,margin,status,reserve,dist,persons,perUnit:kc.qty?P/kc.qty:0};
}

function priceKit(kit, products, pf, S){
  const kc=kitCosts(kit,products,S);
  const m=num(S.margin)/100;
  const res={kc,minP:null,recP:null,err:null};
  if(!kc.qty){ res.err='Adicione pelo menos um produto com quantidade maior que zero.'; return res; }
  res.minP=solvePrice(kc.base,pf,kc.bill,0);
  if(res.minP===null){ res.err='As taxas percentuais somam 100% ou mais: não existe preço que cubra os custos.'; return res; }
  if(m>=1){ res.err='A margem desejada precisa ser menor que 100%.'; }
  else { res.recP=solvePrice(kc.base,pf,kc.bill,m); if(res.recP===null) res.err='Taxas + margem desejada chegam a 100% ou mais: reduza a margem ou as taxas.'; }
  res.min=evaluate(res.minP,kc,pf,S);
  if(res.recP!==null){
    res.rec=evaluate(res.recP,kc,pf,S);
    const d=Math.min(100,Math.max(0,num(kit.discount)));
    if(d>0){ res.discP=round2(res.recP*(1-d/100)); res.disc=evaluate(res.discP,kc,pf,S); }
  }
  if(num(kit.testPrice)>0) res.test=evaluate(round2(num(kit.testPrice)),kc,pf,S);
  return res;
}

const OLD_DEFAULT_NAMES=['Shopee','Mercado Livre Clássico','Mercado Livre Premium','TikTok Shop','Instagram / venda direta'];
function migrate(s){
  s.platforms.forEach(p=>{
    if(!Array.isArray(p.bands)){
      const pct=p.mode==='det'?num(p.pctComm):num(p.pctTotal);
      p.bands=[{min:0,pct,item:0,ship:0}];
      if(num(p.thrPrice)>0&&num(p.thrFee)>0) p.bands=[{min:0,pct,item:num(p.thrFee),ship:0},{min:num(p.thrPrice),pct,item:0,ship:0}];
      if(p.mode!=='det'){ p.pctService=0; p.pctPromo=0; }
      p.promoCap=p.promoCap||0; p.note=p.note||'';
    }
  });
  if(!s.v||s.v<2){
    const keep=s.platforms.filter(p=>!OLD_DEFAULT_NAMES.includes(p.name));
    s.platforms=[...researchedPlatforms(),...keep];
    s.v=2;
  }
  // Caixa do mês (adicionado depois): arquivos antigos recebem valores vazios, nada é apagado
  if(!Array.isArray(s.entries)) s.entries=[];
  if(!s.cash||typeof s.cash!=='object') s.cash={};
  s.cash={fixed:[],withdraw:0,avgFee:20,...s.cash}; if(!Array.isArray(s.cash.fixed)) s.cash.fixed=[];
  // Planejamento financeiro (adicionado depois): preenche o que faltar, sem mexer no resto
  const pd=planDefaults();
  if(!s.cash.plan||typeof s.cash.plan!=='object') s.cash.plan=pd;
  else { const pl=s.cash.plan;
    if(!Array.isArray(pl.buckets)) pl.buckets=pd.buckets; else pd.buckets.forEach(b=>{ if(!pl.buckets.some(x=>x.id===b.id)) pl.buckets.push(b); });
    pl.hire={...pd.hire,...(pl.hire||{})}; pl.initial={...pd.initial,...(pl.initial||{})}; if(pl.boxGoal===undefined) pl.boxGoal=pd.boxGoal; }
  if(!s.cash.months||typeof s.cash.months!=='object'||Array.isArray(s.cash.months)) s.cash.months={};
  if(!Array.isArray(s.cash.moves)) s.cash.moves=[];
  s.cash.split={...{team:30,ads:10,keep:60},...((s.cash.split&&typeof s.cash.split==='object')?s.cash.split:{})};
  const ids=s.platforms.map(p=>p.id);
  if(!ids.includes(s.ui.platformId)) s.ui.platformId=ids[0];
  if(!ids.includes(s.ui.editPlat)) s.ui.editPlat=ids[0];
  return s;
}

// ---- persistência ----
// Tudo é guardado como JSON: estado atual (conta + aparelho), histórico de cópias e backup em arquivo .json
let dbRef=null, bakRef=null, saveT=null, pending=false, backups=[], lastBak=0, downloadsP=Promise.resolve(null);
const LS='muller-atelier-v1';
function setSave(t){const e=document.getElementById('saveState'); if(e) e.textContent=t;}
function persistNow(){
  clearTimeout(saveT); if(!pending) return; pending=false;
  const json=JSON.stringify(state);
  try{localStorage.setItem(LS,json);}catch(e){}
  maybeBackup(json,false);
  if(dbRef){ dbRef.set({state:json,updatedAt:Date.now()}).then(()=>setSave('Salvo na sua conta')).catch(()=>setSave('Salvo neste aparelho')); }
  else setSave('Salvo neste aparelho');
}
function save(){ pending=true; setSave('Salvando…'); clearTimeout(saveT); saveT=setTimeout(persistNow,400); }
function mergeBaks(list){
  const m=new Map(); [...backups,...(list||[])].forEach(b=>{ if(b&&b.at&&typeof b.state==='string') m.set(b.at,b); });
  backups=[...m.values()].sort((a,b)=>b.at-a.at).slice(0,15); lastBak=backups[0]?.at||0;
}
function maybeBackup(json,force){
  const now=Date.now(); if(!force && now-lastBak<10*60*1000) return; lastBak=now;
  backups=[{at:now,state:json},...backups].slice(0,15);
  while(backups.length>1 && JSON.stringify(backups).length>200000) backups.pop();
  try{localStorage.setItem(LS+'-bak',JSON.stringify(backups));}catch(e){}
  if(bakRef) bakRef.set({list:backups}).catch(()=>{});
  const e=document.getElementById('bakList'); if(e) e.innerHTML=bakList();
}
function bakList(){
  if(!backups.length) return '<p class="note">Nenhuma cópia ainda. A primeira é criada na próxima alteração.</p>';
  return '<ul class="baks">'+backups.map(b=>{ let info=''; try{ const s=JSON.parse(b.state); info=`${s.products.length} produtos, ${s.kits.length} kits${Array.isArray(s.entries)?`, ${s.entries.length} lançamentos`:''}`; }catch(e){}
    return `<li><span>${new Date(b.at).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}<small>${info}</small></span><button class="link" data-act="restoreBak" data-id="${b.at}">Restaurar</button></li>`; }).join('')+'</ul>';
}
function blobDownload(name,text,mime){
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:mime||'application/json'})); a.download=name;
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); return true; }catch(e){ return false; }
}
async function downloadText(name,text,mime){
  let dl=null; try{ dl=await downloadsP; }catch(e){}
  if(dl){ try{ await dl.save({filename:name,data:text}); toast('Arquivo exportado'); return; }catch(e){ if(e&&e.code==='declined') return; } }
  if(!window.claude && blobDownload(name,text,mime)){ toast('Arquivo exportado'); return; }
  const ok=await copyText(text); toast(ok?'Conteúdo copiado: cole num arquivo':'Não foi possível exportar');
}
// Arquivos e cópias de antes do Caixa do mês não têm lançamentos: nesse caso os atuais são mantidos.
function keepCash(raw,s){
  if(!raw||!Array.isArray(raw.entries)) s.entries=JSON.parse(JSON.stringify(state.entries||[]));
  if(!raw||!raw.cash) s.cash=JSON.parse(JSON.stringify(state.cash));
  else for(const k of ['split','plan','months','moves']) if(!(k in raw.cash)&&state.cash&&state.cash[k]!==undefined) s.cash[k]=JSON.parse(JSON.stringify(state.cash[k]));
  return s;
}
const CASH_CONFIG_KEYS=['fixed','withdraw','avgFee','split','plan'];
function cashConfig(c){ const o={}; CASH_CONFIG_KEYS.forEach(k=>{ if(c&&c[k]!==undefined) o[k]=JSON.parse(JSON.stringify(c[k])); }); return o; }
// kind: 'all' = tudo; 'config' = plataformas, equipe, margem, custos fixos e metas
async function exportJson(kind){
  const day=new Date().toISOString().slice(0,10), at=new Date().toISOString();
  const payload=kind==='config'
    ? {app:'muller-atelier',type:'config',version:2,exportedAt:at,config:{platforms:state.platforms,settings:state.settings,cash:cashConfig(state.cash)}}
    : {app:'muller-atelier',type:'full',version:2,exportedAt:at,state};
  const json=JSON.stringify(payload,null,2);
  const name=(kind==='config'?'muller-atelier-configuracoes-':'muller-atelier-backup-')+day+'.json';
  await downloadText(name,json,'application/json');
}
async function importFile(file){
  let obj; try{ obj=JSON.parse(await file.text()); }catch(e){ toast('Arquivo JSON inválido'); return; }
  const c=obj&&obj.config;
  if(c){
    if(!Array.isArray(c.platforms)||!c.platforms.length||!c.settings||!Array.isArray(c.settings.people)||!c.settings.people.length){ toast('Arquivo de configurações incompleto'); return; }
    if(!confirm('Substituir plataformas, equipe e margem pelas do arquivo? Seus produtos e kits continuam como estão.')) return;
    maybeBackup(JSON.stringify(state),true);
    const cur=JSON.parse(JSON.stringify(state));
    const s=migrate({...cur,platforms:c.platforms,settings:c.settings,cash:(c.cash&&typeof c.cash==='object')?{...cur.cash,...cashConfig(c.cash)}:cur.cash,v:2});
    state=s; save(); render(); toast('Configurações importadas'); return;
  }
  const raw=obj&&obj.state?obj.state:obj;
  const s0=load(JSON.stringify(raw));
  if(!s0){ toast('Esse arquivo não é um backup do simulador'); return; }
  const s=keepCash(raw,s0);
  if(!confirm('Substituir todos os dados atuais pelo arquivo? Os dados atuais ficam guardados no histórico de cópias.')) return;
  maybeBackup(JSON.stringify(state),true); state=s; save(); render(); toast('Backup importado');
}
function load(json){ try{ const s=JSON.parse(json); if(s&&s.products&&s.kits&&s.platforms&&s.settings){ const d=defaults(); s.ui={...d.ui,...(s.ui||{})}; return migrate(s); } }catch(e){} return null; }
async function initDb(){
  try{
    if(!window.claude||!window.claude.use) return;
    downloadsP=claude.use('downloads').catch(()=>null);
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    dbRef=db.doc('data/users/'+id+'/app');
    bakRef=db.doc('data/users/'+id+'/backup');
    try{ const bs=await bakRef.get(); if(bs.exists) mergeBaks(bs.data().list); }catch(e){}
    const snap=await dbRef.get();
    const s=snap.exists?load(snap.data().state):null;
    if(s){ state=s; render(); setSave('Salvo na sua conta'); } else save();
    if(backups.length) bakRef.set({list:backups}).catch(()=>{});
  }catch(e){ dbRef=null; }
}

function scenario(title,e,minP){

  return `<div class="scen"><div class="shead"><h3>${title}</h3>${badge(e.status)}</div>${warn}
   <dl class="kv"><dt>Preço de venda</dt><dd class="b">${brl(e.P)}</dd><dt>Taxas, impostos e frete</dt><dd>${brl(e.f.total)}</dd>
   <dt>Custo total</dt><dd>${brl(e.total)}</dd><dt>Lucro adicional</dt><dd class="${e.profit<0?'neg':'pos'}">${brl(e.profit)}</dd><dt>Margem efetiva</dt><dd>${pct(e.margin)}</dd></dl>

function summaryText(){
  const k=curKit(), pf=curPlat(), r=priceKit(k,state.products,pf,S()), kc=r.kc;

  if(r.recP===null){ L.push(r.err||'Sem preço recomendado.'); return L.join('\n'); }
  const e=r.rec;
  L.push(`Preço recomendado: ${brl(r.recP)}`,`Preço mínimo sem prejuízo: ${brl(r.minP)}`,`Preço por unidade: ${brl(e.perUnit)}`,``,
   `Materiais: ${brl(kc.mat)}`,`Embalagem: ${brl(kc.pack)}`,`Outros custos: ${brl(kc.other)}`,`Mão de obra (${hm(kc.minutes)}): ${brl(kc.labor)}`,
   `Taxas da plataforma: ${brl(e.f.platform)}`,`Impostos: ${brl(e.f.tax)}`,`Publicidade: ${brl(e.f.ads)}`,`Frete líquido: ${brl(e.f.freight)}`,`Outros encargos: ${brl(e.f.other)}`,
   `Custo total da operação: ${brl(e.total)}`,`Lucro adicional: ${brl(e.profit)}`,`Margem efetiva: ${pct(e.margin)}`,``);
  e.persons.forEach(p=>L.push(`${p.name}: trabalho ${brl(p.labor)} + lucro ${brl(p.share)} = ${brl(p.total)}`));
  if(e.reserve>0) L.push(`Reserva do ateliê: ${brl(e.reserve)}`);
  if(r.disc) L.push(``,`Com ${num(k.discount)}% de desconto: ${brl(r.discP)} — lucro ${brl(r.disc.profit)} (${pct(r.disc.margin)}) — ${statusTxt[r.disc.status]}`);

}

}

function shiftMonth(m,k){ let [y,mo]=m.split('-').map(Number); mo+=k; while(mo<1){mo+=12;y--;} while(mo>12){mo-=12;y++;} return y+'-'+pad(mo); }
function monthName(m){ const [y,mo]=m.split('-').map(Number); const t=new Date(y,mo-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}); return t.charAt(0).toUpperCase()+t.slice(1); }

function monthData(m){
  const E=state.entries.filter(e=>monthOf(e.date)===m), outs=E.filter(e=>e.type!=='in'), ins=E.filter(e=>e.type==='in');
  const byCat={}; outs.forEach(e=>{ const c=e.cat||'Outros gastos'; byCat[c]=(byCat[c]||0)+num(e.amount); });
  const spent=outs.reduce((a,e)=>a+num(e.amount),0), received=ins.reduce((a,e)=>a+num(e.amount),0);
  const material=outs.filter(e=>PROD_CATS.includes(e.cat)).reduce((a,e)=>a+num(e.amount),0);

  const fee=Math.min(95,Math.max(0,num(state.cash.avgFee)))/100, goal=spent+fixed+withdraw;

function bucketName(b){
  if(b.kind==='person'){ const p=S().people[b.idx]; return 'Retirada · '+(p&&p.name?p.name:'Sócia '+(b.idx+1)); }
  return {ads:'Ads (publicidade)',hire:'Reserva para contratação',box:'Caixa da empresa'}[b.id]||b.id;
}
const bucketSum=()=>P().buckets.reduce((a,b)=>a+num(b.pct),0);
function hireGoal(){ const h=P().hire, t=Math.max(0,num(h.months))*(num(h.salary)+num(h.das)), r=num(h.round)>0?num(h.round):1; return Math.ceil(t/r-1e-9)*r; }
function hireGoalText(){ const h=P().hire, t=Math.max(0,num(h.months))*(num(h.salary)+num(h.das));
  return `${num(h.months).toLocaleString('pt-BR')} × (${brl(num(h.salary))} + ${brl(num(h.das))}) = ${brl(t)}, arredondado para <b>${brl(hireGoal())}</b>`; }

function monthFin(m){
  const rec=state.cash.months[m]||{}, d=monthData(m), adsSpent=d.byCat[ADS_CAT]||0;
  const manual=String(rec.revenue??'').trim()!=='';
  const revenue=manual?num(rec.revenue):d.received, ops=d.spent-adsSpent, fees=num(rec.fees), taxes=num(rec.taxes);
  const costs=ops+d.fixed+fees+taxes, profit=revenue-costs;
  const dist=P().buckets.map(b=>({...b,value:profit>0?profit*num(b.pct)/100:0}));
  const val=id=>(dist.find(x=>x.id===id)||{value:0}).value;
  return {m,manual,entriesRev:d.received,revenue,ops,fixed:d.fixed,fees,taxes,costs,profit,dist,ads:val('ads'),hire:val('hire'),box:val('box'),adsSpent,deficit:profit<0?-profit:0};
}
function firstMonth(){
  const ms=[...state.entries.map(e=>monthOf(e.date)),...Object.keys(state.cash.months).filter(k=>hasRec(state.cash.months[k])),...state.cash.moves.map(x=>monthOf(x.date))].filter(x=>/^\d{4}-\d{2}$/.test(x)).sort();

// Saldos das reservas até o fim do mês "upto". Lucro positivo deposita; prejuízo sai do caixa da empresa; a reserva de contratação nunca é usada automaticamente.
function ledger(upto){
  const init=P().initial, bal={hire:num(init.hire),box:num(init.box)}, rows=[], first=firstMonth();
  if(first&&first<=upto) for(let m=first,i=0;m<=upto&&i<600;m=shiftMonth(m,1),i++){
    const f=monthFin(m), mv={hire:{in:0,out:0},box:{in:0,out:0}};
    state.cash.moves.filter(x=>monthOf(x.date)===m&&mv[x.fund]).forEach(x=>{ mv[x.fund][x.type==='in'?'in':'out']+=Math.max(0,num(x.amount)); });
    bal.hire+=f.hire+mv.hire.in-mv.hire.out;
    bal.box+=f.box+mv.box.in-mv.box.out-f.deficit;
    rows.push({m,f,mv,bal:{...bal}});
  }
  return {bal,rows};
}

   <p class="note">Os nomes das sócias vêm de Ajustes e backup.</p>
   <h3>Meta 1 · Reserva para contratação</h3>
   <div class="grid g4">${money('hire','','salary',pl.hire.salary,'Remuneração mensal')}${money('hire','','das',pl.hire.das,'Ajuda de custo (DAS)')}${inp('hire','','months',pl.hire.months,{label:'Meses de reserva',suf:'meses'})}${money('hire','','round',pl.hire.round,'Arredondar para múltiplo de')}</div>
   <p class="note" id="hireGoal"></p>
   <h3>Meta 2 · Caixa para materiais</h3>
   <div class="grid">${money('plan','','boxGoal',pl.boxGoal,'Meta do caixa da empresa')}</div>
   <h3>Saldos iniciais</h3>
   <div class="grid">${money('initial','','hire',pl.initial.hire,'Reserva para contratação','Dinheiro que já estava guardado')}${money('initial','','box',pl.initial.box,'Caixa da empresa','Dinheiro que já estava guardado')}</div>
   <h3>Movimentar as reservas</h3>
   <p class="note" style="margin:0 0 10px">Use para compras grandes pagas com o caixa (não lance de novo como gasto) ou para aportes. A reserva de contratação é protegida.</p>
   ${mv.length?mv.map(mrow).join(''):'<p class="empty sm">Nenhuma movimentação neste mês.</p>'}
   <div class="btns" style="margin-top:10px"><button class="btn ghost sm" data-act="addMove" data-id="box-out">+ Retirada do caixa</button><button class="btn ghost sm" data-act="addMove" data-id="box-in">+ Depósito no caixa</button><button class="link" data-act="addMove" data-id="hire-in">+ Depósito na reserva</button><button class="link danger" data-act="addMove" data-id="hire-out">Retirada da reserva</button></div>
  </section><section id="planRes" class="results"></section></div>`;
}
function planResults(){
  const m=state.ui.month, L=ledger(m), f=monthFin(m), row=L.rows.find(r=>r.m===m)||{mv:{hire:{in:0,out:0},box:{in:0,out:0}}};
  const goal1=hireGoal(), goal2=num(P().boxGoal), cur=monthOf(today())===m, sum=bucketSum();
  const ppl=f.dist.filter(b=>b.kind==='person');
  const hist=L.rows.slice(-12).reverse();
  const B=id=>f.dist.find(x=>x.id===id)||{pct:0,value:0};
  return `<div class="panel"><div class="shead"><h2>Resultado do mês</h2>${cur?'<span class="badge below">Em andamento</span>':''}</div>
   <div class="hero"><span>${f.profit<0?'Prejuízo do mês':'Lucro disponível para distribuir'}</span><strong class="${f.profit<0?'neg':''}">${brl(f.profit)}</strong><span class="hsub">Faturamento ${brl(f.revenue)} − custos ${brl(f.costs)}</span></div>
   <dl class="kv"><dt>Faturamento ${f.manual?'(informado)':'(entradas lançadas)'}</dt><dd>${brl(f.revenue)}</dd>
    <dt>Materiais, embalagens e gastos</dt><dd>${brl(f.ops)}</dd><dt>Custos fixos</dt><dd>${brl(f.fixed)}</dd><dt>Taxas dos marketplaces</dt><dd>${brl(f.fees)}</dd><dt>Impostos</dt><dd>${brl(f.taxes)}</dd>
    <dt class="b">Custos e despesas totais</dt><dd class="b">${brl(f.costs)}</dd></dl>
   ${f.profit<0?`<div class="alert loss">Sem lucro para distribuir. O prejuízo de ${brl(f.deficit)} sai do caixa da empresa.</div>`:''}
   ${Math.abs(sum-100)>0.001?`<div class="alert loss">A distribuição soma ${sum.toLocaleString('pt-BR')}%. Ajuste para 100%.</div>`:''}</div>
  <div class="panel"><h2>Distribuição do lucro</h2>
   <div class="ppl">${ppl.map(b=>`<div class="pcard"><b>${esc(bucketName(b).replace('Retirada · ',''))}</b><span class="note">Retirada · ${num(b.pct).toLocaleString('pt-BR')}%</span><div class="ptot">${brl(b.value)}</div></div>`).join('')}</div>
   <dl class="kv" style="margin-top:14px"><dt>Ads (publicidade) · ${num(B('ads').pct).toLocaleString('pt-BR')}%</dt><dd class="b">${brl(f.ads)}</dd>
    <dt>Gasto em ads lançado</dt><dd>${brl(f.adsSpent)}</dd><dt>${f.ads-f.adsSpent<0?'Passou da verba':'Ainda dá para investir'}</dt><dd class="${f.ads-f.adsSpent<0?'neg':'pos'}">${brl(Math.abs(f.ads-f.adsSpent))}</dd>
    <dt>Reserva para contratação · ${num(B('hire').pct).toLocaleString('pt-BR')}%</dt><dd class="b">${brl(f.hire)}</dd>
    <dt>Caixa da empresa · ${num(B('box').pct).toLocaleString('pt-BR')}%</dt><dd class="b">${brl(f.box)}</dd></dl></div>
  <div class="panel"><h2>Metas financeiras</h2>
   ${goalCard('Reserva para contratação',L.bal.hire,goal1,f.hire,'Protegida: só para pagar a futura colaboradora.')}
   ${goalCard('Caixa para materiais',L.bal.box,goal2,f.box-f.deficit,'')}
   <dl class="kv"><dt class="b">Total acumulado nas duas reservas</dt><dd class="b">${brl(L.bal.hire+L.bal.box)}</dd></dl>
   <p class="note">Saldos no fim de ${monthName(m).toLowerCase()}.</p></div>
  <div class="panel"><h2>Movimento das reservas no mês</h2>
   <h3 style="margin-top:0">Caixa da empresa</h3><dl class="kv"><dt>Entrada: ${num(B('box').pct).toLocaleString('pt-BR')}% do lucro</dt><dd class="pos">${brl(f.box)}</dd>
    ${row.mv.box.in?`<dt>Depósitos extras</dt><dd class="pos">${brl(row.mv.box.in)}</dd>`:''}${f.deficit?`<dt>Saída: cobertura do prejuízo</dt><dd class="neg">−${brl(f.deficit)}</dd>`:''}
    ${row.mv.box.out?`<dt>Saídas: retiradas</dt><dd class="neg">−${brl(row.mv.box.out)}</dd>`:''}<dt class="b">Saldo acumulado</dt><dd class="b ${L.bal.box<0?'neg':''}">${brl(L.bal.box)}</dd></dl>
   <h3>Reserva para contratação</h3><dl class="kv"><dt>Entrada: ${num(B('hire').pct).toLocaleString('pt-BR')}% do lucro</dt><dd class="pos">${brl(f.hire)}</dd>
    ${row.mv.hire.in?`<dt>Depósitos extras</dt><dd class="pos">${brl(row.mv.hire.in)}</dd>`:''}${row.mv.hire.out?`<dt>Saídas: retiradas</dt><dd class="neg">−${brl(row.mv.hire.out)}</dd>`:''}
    <dt class="b">Saldo acumulado</dt><dd class="b">${brl(L.bal.hire)}</dd></dl>
   ${L.bal.box<0?'<div class="alert loss">O caixa da empresa está negativo: os gastos passaram do que foi guardado.</div>':''}</div>
  <div class="panel"><h2>Histórico mensal</h2>
   ${hist.length?`<div class="tablewrap"><table class="cmp hist-t"><thead><tr><th>Mês</th><th>Faturamento</th><th>Custos</th><th>Lucro</th>${ppl.map(b=>`<th>${esc(bucketName(b).replace('Retirada · ',''))}</th>`).join('')}<th>Ads</th><th>Reserva</th><th>Caixa</th><th>Saldo reserva</th><th>Saldo caixa</th></tr></thead><tbody>
    ${hist.map(r=>`<tr${r.m===m?' class="on"':''}><th>${monthName(r.m).replace(' de ',' ')}</th><td>${brl(r.f.revenue)}</td><td>${brl(r.f.costs)}</td><td class="${r.f.profit<0?'neg':''}">${brl(r.f.profit)}</td>${r.f.dist.filter(b=>b.kind==='person').map(b=>`<td>${brl(b.value)}</td>`).join('')}<td>${brl(r.f.ads)}</td><td>${brl(r.f.hire)}</td><td>${brl(r.f.box-r.f.deficit)}</td><td>${brl(r.bal.hire)}</td><td>${brl(r.bal.box)}</td></tr>`).join('')}
   </tbody></table></div>
   <div class="btns"><button class="btn ghost sm" data-act="exportPlanCsv">Baixar histórico (.csv)</button></div>`:'<p class="note" style="margin:0">Lance entradas e gastos para começar o histórico.</p>'}</div>`;
}
async function exportPlanCsv(){
  const m=state.ui.month, L=ledger(m), names=P().buckets.map(bucketName);
  const H=['Mês','Faturamento','Custos e despesas','Lucro disponível',...names,'Cobertura de prejuízo','Retiradas do caixa','Depósitos no caixa','Retiradas da reserva','Depósitos na reserva','Saldo reserva contratação','Saldo caixa da empresa'];
  const rows=[H.map(csvCell).join(';'),...L.rows.map(r=>[monthName(r.m),csvNum(r.f.revenue),csvNum(r.f.costs),csvNum(r.f.profit),...r.f.dist.map(b=>csvNum(b.value)),csvNum(r.f.deficit),csvNum(r.mv.box.out),csvNum(r.mv.box.in),csvNum(r.mv.hire.out),csvNum(r.mv.hire.in),csvNum(r.bal.hire),csvNum(r.bal.box)].map(csvCell).join(';'))];
  await downloadText('muller-atelier-planejamento-ate-'+m+'.csv','\ufeff'+rows.join('\r\n'),'text/csv');
}

// ===== eventos =====
function onInput(e){
  const t=e.target; if(!t.dataset||!t.dataset.col) return;
  if(t.type==='radio'||t.type==='checkbox'||t.tagName==='SELECT') return;
  if(t.dataset.col==='bands'){ const p=state.platforms.find(x=>x.id===t.dataset.pid); const b=p&&p.bands[+t.dataset.id]; if(b) b[t.dataset.f]=t.value; save(); renderResults(); return; }
  setVal(t.dataset.col,t.dataset.id,t.dataset.f,t.value); save(); renderResults();
}
function onChange(e){
  const t=e.target;
  if(t.id==='importFile'){ const f=t.files&&t.files[0]; t.value=''; if(f) importFile(f); return; }
  if(!t.dataset||!t.dataset.col) return;
  if(!(t.type==='radio'||t.type==='checkbox'||t.type==='date'||t.tagName==='SELECT')) return;
  setVal(t.dataset.col,t.dataset.id,t.dataset.f,t.type==='checkbox'?t.checked:t.value); save(); render();
}
async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); return true; }catch(e){
    const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); let ok=false; try{ok=document.execCommand('copy');}catch(_){} ta.remove(); return ok; }
}
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2200); }
function onClick(e){
  const b=e.target.closest('[data-act],[data-tab]'); if(!b) return;
  if(b.dataset.tab){ state.ui.tab=b.dataset.tab; save(); render(); window.scrollTo(0,0); return; }
  const a=b.dataset.act, id=b.dataset.id, k=curKit(), u=state.ui;
  switch(a){
    case 'selKit': u.kitId=id; break;
    case 'addKit': { const nk={id:uid(),name:'Novo kit',items:state.products[0]?[{id:uid(),pid:state.products[0].id,qty:1}]:[],packaging:2,prep:0,otherCost:0,billable:1,discount:0,testPrice:''}; state.kits.push(nk); u.kitId=nk.id; u.tab='kits'; break; }
    case 'dupKit': { const c=JSON.parse(JSON.stringify(k)); c.id=uid(); c.name=k.name+' (cópia)'; c.items.forEach(i=>i.id=uid()); state.kits.push(c); u.kitId=c.id; toast('Kit duplicado'); break; }
    case 'delKit': if(!confirm(`Excluir “${k.name}”?`)) return; state.kits=state.kits.filter(x=>x!==k); u.kitId=state.kits[0]?.id; break;
    case 'addItem': k.items.push({id:uid(),pid:state.products[0].id,qty:1}); break;
    case 'delItem': k.items=k.items.filter(i=>i.id!==id); break;
    case 'selPlatform': u.platformId=id; break;
    case 'addProduct': { const p={id:uid(),name:'Novo produto',material:0,other:0,bordado:0,costura:0,extraMin:0}; state.products.unshift(p); u.productId=p.id; break; }
    case 'delProduct': { const p=state.products.find(x=>x.id===id); const used=state.kits.filter(kk=>kk.items.some(i=>i.pid===id)).length;
      if(!confirm(`Excluir “${p.name}”?${used?` Ele será removido de ${used} kit(s).`:''}`)) return;
      state.products=state.products.filter(x=>x.id!==id); state.kits.forEach(kk=>kk.items=kk.items.filter(i=>i.pid!==id)); break; }
    case 'editPlat': u.editPlat=id; break;
    case 'addPlatform': { const p=blankPlatform('Nova plataforma'); state.platforms.push(p); u.editPlat=p.id; break; }
    case 'addBand': { const p=state.platforms.find(x=>x.id===u.editPlat); const l=p.bands[p.bands.length-1]; p.bands.push({min:round2(num(l.min)+50),pct:l.pct,item:l.item,ship:l.ship}); break; }
    case 'delBand': { const p=state.platforms.find(x=>x.id===u.editPlat); p.bands.splice(+id,1); break; }
    case 'dupPlatform': { const s=state.platforms.find(x=>x.id===u.editPlat); const c={...JSON.parse(JSON.stringify(s)),id:uid(),name:s.name+' (cópia)'}; state.platforms.push(c); u.editPlat=c.id; break; }
    case 'delPlatform': { if(state.platforms.length<2){ toast('Mantenha pelo menos uma plataforma'); return; } const s=state.platforms.find(x=>x.id===u.editPlat); if(!confirm(`Excluir “${s.name}”?`)) return;
      state.platforms=state.platforms.filter(x=>x!==s); u.editPlat=state.platforms[0].id; if(u.platformId===s.id) u.platformId=state.platforms[0].id; break; }
    case 'addPerson': { const n=S().people.length+1; S().people.push({id:uid(),name:'Pessoa '+n,rate:S().rate,timePct:100,share:0}); break; }
    case 'delPerson': S().people=S().people.filter(p=>p.id!==id); break;
    case 'copy': copyText(summaryText()).then(ok=>toast(ok?'Resumo copiado':'Não foi possível copiar')); return;
    case 'print': window.print(); return;
    case 'restore': if(!confirm('Restaurar todos os valores iniciais do Müller Atelier? Os lançamentos do caixa são mantidos e os dados atuais ficam no histórico de cópias.')) return; maybeBackup(JSON.stringify(state),true); { const keep={entries:state.entries,cash:state.cash}; state=defaults(); state.entries=keep.entries; state.cash=keep.cash; } toast('Valores iniciais restaurados'); break;
    case 'clear': if(!confirm('Apagar todos os produtos e kits? Uma cópia fica guardada no histórico.')) return; maybeBackup(JSON.stringify(state),true); state.products=[]; state.kits=[]; u.kitId=null; u.tab='products'; break;
    case 'exportJson': exportJson(id); return;
    case 'month': u.month=shiftMonth(u.month||monthOf(today()),+id); break;
    case 'addEntry': { const e={id:uid(),date:monthOf(today())===u.month?today():u.month+'-01',type:id==='in'?'in':'out',desc:'',cat:id==='in'?inCats()[0]:OUT_CATS[0],amount:''};
      state.entries.push(e); save(); render(); const el=document.querySelector(`[data-col="entries"][data-id="${e.id}"][data-f="desc"]`); if(el) el.focus(); return; }
    case 'delEntry': { const e=state.entries.find(x=>x.id===id); if(e&&(num(e.amount)||e.desc)&&!confirm('Excluir este lançamento?')) return; state.entries=state.entries.filter(x=>x.id!==id); break; }
    case 'addFixed': state.cash.fixed.push({id:uid(),desc:'',amount:''}); break;
    case 'delFixed': state.cash.fixed=state.cash.fixed.filter(x=>x.id!==id); break;
    case 'exportCsv': exportCsv(id); return;
    case 'exportPlanCsv': exportPlanCsv(); return;
    case 'addMove': { const [fund,type]=id.split('-');
      if(fund==='hire'&&type==='out'&&!confirm('A reserva para contratação é protegida para pagar a futura colaboradora. Registrar uma retirada mesmo assim?')) return;
      state.cash.moves.push({id:uid(),date:monthOf(today())===u.month?today():u.month+'-01',fund,type,desc:'',amount:''}); break; }
    case 'delMove': { const x=state.cash.moves.find(v=>v.id===id); if(x&&(num(x.amount)||x.desc)&&!confirm('Excluir esta movimentação?')) return; state.cash.moves=state.cash.moves.filter(v=>v.id!==id); break; }
    case 'restoreBak': { const b=backups.find(x=>String(x.at)===id); let raw=null; try{ raw=JSON.parse(b.state); }catch(e){} const s0=b&&load(b.state); if(!s0){ toast('Cópia inválida'); return; } const s=keepCash(raw,s0);
      if(!confirm('Voltar para a cópia de '+new Date(b.at).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})+'? Os dados atuais também ficam guardados no histórico.')) return;
      maybeBackup(JSON.stringify(state),true); state=s; state.ui.tab='team'; toast('Cópia restaurada'); break; }
    default: return;
  }
  save(); render();
}
document.addEventListener('DOMContentLoaded',()=>{
  try{ const s=load(localStorage.getItem(LS)); if(s) state=s; }catch(e){}
  try{ mergeBaks(JSON.parse(localStorage.getItem(LS+'-bak')||'[]')); }catch(e){}
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') persistNow(); });
  window.addEventListener('pagehide',persistNow);
  const v=document.getElementById('view');
  v.addEventListener('input',onInput); v.addEventListener('change',onChange);
  document.addEventListener('click',onClick);
  document.addEventListener('keydown',e=>{ if(e.target.id==='importLabel'&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); document.getElementById('importFile').click(); } });
  render(); initDb();
});
</script></body></html>
